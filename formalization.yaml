fidelity:
  divergences: >-
    Naturals include 0. Basis means eventual representation with at most r
    summands, repetitions allowed. Separate exact-r versions use r • A.
    Restricted sums use exactly r distinct elements. Counting densities use
    [1,N] divided by N, with the value at N=0 irrelevant to asymptotic density.
    No statement strengthening or weakening was introduced during packaging.

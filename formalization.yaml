version: v0.4
project:
  name: "Erdős 339: positive density of restricted sumsets"
  description: >-
    Lean proof development of the positive lower density of sums of exactly r
    distinct elements of an additive basis of order r, together with the
    positive upper density implication from unrestricted to restricted sumsets.
    Both at-most-r and exactly-r conventions for unrestricted addition are
    represented. The development uses a finite counting argument which isolates
    tuple coordinates, then transfers the resulting bounds to densities.
    The supplied proof text has not been compiled or checked with Comparator
    in the packaging environment; no novelty is claimed.
  authors: ["Alexander (AItoBit)"]
  responsible_maintainers: ["Alexander (AItoBit)"]
  license: MIT
